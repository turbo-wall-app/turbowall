name = "turbo-wall"
main = "src/workers/cf-worker.js"
compatibility_date = "2026-06-07"

routes = [
  { pattern = "test.domain.com/*", zone_name = "domain.com" }
]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
